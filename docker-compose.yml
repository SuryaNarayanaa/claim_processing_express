services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/claimnexus-local-only
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["127.0.0.1:7475:7474", "127.0.0.1:7688:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p claimnexus-local-only 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
volumes:
  mongo_data:
  neo4j_data:
